[package]
name = "pacopt"
version = "0.1.0"
edition = "2024"
description = "A tool to query optional deps of an installed package"
documentation = ""
readme = ""
homepage = ""
repository = ""
license = "GPL-3.0-or-later"
publish = false

[dependencies]
alpm = "~5"
anyhow = "~1"
clap = { version = "~4.6", features = ["derive"] }
pacmanconf = "~3"
serde = { version = "~1", features = ["derive"] }
serde_json = "~1"
tabled = "~0.20"
tracing = { version = "~0.1", features = [
  "max_level_debug",
  "release_max_level_debug",
] }
tracing-subscriber = { version = "~0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
] }
